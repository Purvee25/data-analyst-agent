# Render Blueprint — one-click deploy of the single-service app.
# In the Render dashboard: New → Blueprint → point at this repo. Render reads
# this file, builds the Dockerfile, and deploys a free web service.
#
# The only thing you must set yourself is the LLM secret (marked sync:false),
# because a public deploy can't reach your local Ollama — it needs a hosted
# model. Set ANTHROPIC_API_KEY in the dashboard to run on Claude.
services:
  - type: web
    name: autonomous-data-analyst
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false        # set this in the Render dashboard (never in git)
