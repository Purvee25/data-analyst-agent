# Render Blueprint — one-click deploy of the single-service app.
# In the Render dashboard: New → Blueprint → point at this repo. Render reads
# this file, builds the Dockerfile, and deploys a free web service.
#
# A public deploy can't reach your local Ollama, so it runs on Groq — a FREE,
# hosted, OpenAI-compatible model. The only thing you set yourself is the free
# GROQ_API_KEY (marked sync:false) in the Render dashboard. Get one at
# https://console.groq.com. To use Claude instead, switch LLM_PROVIDER to
# "anthropic" and set ANTHROPIC_API_KEY.
services:
  - type: web
    name: autonomous-data-analyst
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false        # set this in the Render dashboard (never in git)
