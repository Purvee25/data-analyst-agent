[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter/reviewer judgement
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"api/main.py" = ["B008"]  # FastAPI's File(...)/Depends(...) defaults are idiomatic
"app.py" = ["SIM105"]  # legacy Streamlit UI, out of scope for this pass
